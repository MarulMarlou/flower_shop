{% extends "base_generic.html" %}
{% block content %}
  <h1>Обращения клиентов</h1>
  <table>
    <tr>
      <th>ID</th>
      <th>Клиент</th>
      <th>Тема</th>
      <th>Статус</th>
    </tr>
    {% for ticket in tickets %}
      <tr>
        <td>{{ ticket.id }}</td>
        <td>{{ ticket.client }}</td>
        <td>{{ ticket.subject }}</td>
        <td>{{ ticket.is_resolved }}</td>
      </tr>
    {% empty %}
      <tr><td colspan="4">Нет обращений.</td></tr>
    {% endfor %}
  </table>
{% endblock %}
