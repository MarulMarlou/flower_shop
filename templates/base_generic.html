<!DOCTYPE html>
<html>
<head>
    <title>Система учета заказов</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="{% url 'client_list' %}">
            ФлауВау
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarNav" aria-controls="navbarNav"
                aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <!-- Клиенты -->
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" href="#"
                       id="clientsDropdown" role="button"
                       data-bs-toggle="dropdown" aria-expanded="false">
                        Клиенты
                    </a>
                    <ul class="dropdown-menu" aria-labelledby="clientsDropdown">
                        <li><a class="dropdown-item" href="{% url 'client_list' %}">
                            Список клиентов
                        </a></li>
                        <li><a class="dropdown-item" href="{% url 'create_client' %}">
                            Добавить клиента
                        </a></li>
                    </ul>
                </li>

                <!-- Заказы -->
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" href="#"
                       id="ordersDropdown" role="button"
                       data-bs-toggle="dropdown" aria-expanded="false">
                        Заказы
                    </a>
                    <ul class="dropdown-menu" aria-labelledby="ordersDropdown">
                        <li><a class="dropdown-item" href="{% url 'order_list' %}">
                            Список заказов
                        </a></li>
                        <li><a class="dropdown-item" href="{% url 'create_order' %}">
                            Создать заказ
                        </a></li>
                    </ul>
                </li>

                <!-- Поддержка -->
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" href="#"
                       id="supportDropdown" role="button"
                       data-bs-toggle="dropdown" aria-expanded="false">
                        Поддержка
                    </a>
                    <ul class="dropdown-menu" aria-labelledby="supportDropdown">
                        <li><a class="dropdown-item" href="{% url 'create_ticket' %}">
                            Новое обращение
                        </a></li>
                        <li><a class="dropdown-item" href="{% url 'ticket_list' %}">
                            Список обращений
                        </a></li>
                    </ul>
                </li>

                <!-- Аналитика -->
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'analytics' %}">
                        Аналитика
                    </a>
                </li>

                <!-- Админка (если нужно) -->
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'admin:index' %}">
                        Админ панель
                    </a>
                </li>
            </ul>
        </div>
    </div>
</nav>

    <div class="container mt-5">
        {% block content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
